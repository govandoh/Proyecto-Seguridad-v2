# Bus de eventos de la plataforma. Sin acceso anónimo: cada servicio tiene su
# usuario y una ACL con el mínimo de tópicos que necesita (ISO/IEC 27001 8.3).
per_listener_settings false
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
